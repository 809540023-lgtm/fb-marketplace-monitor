        sync: false
      - key: SCHOOL_PLATFORM_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SCHOOL_PLATFORM_STRIPE_SUCCESS_URL
        sync: false
      - key: SCHOOL_PLATFORM_STRIPE_CANCEL_URL
        sync: false
      - key: SCHOOL_PLATFORM_EMAIL_PROVIDER
        value: mock
      - key: SCHOOL_PLATFORM_SMTP_HOST
        sync: false
      - key: SCHOOL_PLATFORM_SMTP_PORT
        value: "587"
      - key: SCHOOL_PLATFORM_SMTP_USERNAME
        sync: false
      - key: SCHOOL_PLATFORM_SMTP_PASSWORD
        sync: false
      - key: SCHOOL_PLATFORM_SMTP_FROM_EMAIL
        sync: false
      - key: SCHOOL_PLATFORM_RESEND_API_KEY
        sync: false
