        sync: false

  - type: cron
    name: ai-agent-team-cron
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --query "$DEFAULT_QUERY"
    schedule: "*/30 * * * *"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
